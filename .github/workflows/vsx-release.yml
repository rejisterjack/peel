name: Release VS Code Extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build, package, publish to Marketplace
    if: "startsWith(github.event.head_commit.message, 'release: vsx-v')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tag the release commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^vsx-v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: vsx-vX.Y.Z (got: ${tag})"
            exit 1
          fi
          git tag -f "$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: apps/vsx
        run: bun run lint

      - name: Type check
        working-directory: apps/vsx
        run: bun run check-types

      - name: Unit tests
        working-directory: apps/vsx
        run: bun run test

      - name: Production package
        working-directory: apps/vsx
        run: bun run package

      - name: Build .vsix
        working-directory: apps/vsx
        run: bunx @vscode/vsce package --no-dependencies --no-git-tag-version

      - name: Read version
        id: version
        working-directory: apps/vsx
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "vsx-v${VERSION}"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=fdh-vsx-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        working-directory: apps/vsx
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --no-dependencies --packagePath "./${{ steps.version.outputs.vsix }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: apps/vsx/${{ steps.version.outputs.vsix }}
